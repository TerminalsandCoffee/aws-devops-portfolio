name: Reusable Terraform CI

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: "Path to the Terraform configuration"
      aws-region:
        required: false
        type: string
        default: "us-east-1"
        description: "AWS Region"

jobs:
  validate:
    name: Validate & Sec Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Run tflint
        uses: terraform-linters/tflint-action@v2
        with:
          working_directory: ${{ inputs.working-directory }}
          args: "--recursive"

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@4f9f1bef9f759c19c966f39c0638ea427d776f4d # v12.3060.0
        with:
          directory: ${{ inputs.working-directory }}
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@096a89ea781ad15884828b1490898d6948bd1605 # v3.39.3
        with:
          sarif_file: checkov.sarif
        if: always()

      - name: Cache Terraform
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ inputs.working-directory }}/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}

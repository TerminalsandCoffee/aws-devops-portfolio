name: Deploy 01 ECS Fargate Webapp

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "projects/01-ecs-fargate-ci-cd-pipeline-webapp/app/**"
  #     - ".github/workflows/ecs-fargate-deploy.yml"

env:
  AWS_REGION: us-east-1
  APP_PATH: projects/01-ecs-fargate-ci-cd-pipeline-webapp/app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/01-ecs-fargate-ci-cd-pipeline-webapp/app

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest

  build-and-push-image:
    name: Build & push Docker image to ECR
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build, tag and push image
        id: build
        working-directory: ${{ env.APP_PATH }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy-to-dev:
    name: Deploy to ECS (dev)
    runs-on: ubuntu-latest
    needs: build-and-push-image

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Materialize task definition template
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          sed "s/ACCOUNT_ID/${ACCOUNT}/g" \
            projects/01-ecs-fargate-ci-cd-pipeline-webapp/infra/taskdef.json \
            > /tmp/taskdef.json

      - name: Render task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@731946636f59740045709b55a095be66765facea # v1.9.1
        with:
          task-definition: /tmp/taskdef.json
          container-name: flask-ecs-demo
          image: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy ECS service (dev)
        uses: aws-actions/amazon-ecs-deploy-task-definition@ae89e14ac6188020feb2b19228b7149a7bc9cf0b # v2.6.4
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME_DEV }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME_DEV }}
          wait-for-service-stability: true

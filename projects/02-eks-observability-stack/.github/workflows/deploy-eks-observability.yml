#name: Deploy EKS Observability
# Disabling until project is built out.

#on:
#  push:
#    branches: [ main ]
#    paths: [ 'projects/02-eks-observability-stack/**' ]
#  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: 1.5.0

    - name: Terraform Init & Plan
      working-directory: ./projects/02-eks-observability-stack/infra/terraform
      run: |
        terraform init
        terraform plan

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main'
      working-directory: ./projects/02-eks-observability-stack/infra/terraform
      run: terraform apply -auto-approve

    - name: Setup Helm
      uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: "v1.32.2"

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --region us-east-1 --name eks-observability-demo

    - name: Helm Upgrade
      if: github.ref == 'refs/heads/main'
      run: |
        helm upgrade --install observability prometheus-community/kube-prometheus-stack \
          --namespace monitoring \
          -f projects/02-eks-observability-stack/helm-charts/prometheus-values.yaml

# helm/grafana/values.yaml
# Grafana with pre-built dashboards + secure defaults

grafana:
  enabled: true

  # Never commit an admin password. Create a Kubernetes Secret before install:
  #   kubectl -n observability create secret generic grafana-admin \
  #     --from-literal=admin-user=admin \
  #     --from-literal=admin-password="$(openssl rand -base64 24)"
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Persistence
  persistence:
    enabled: true
    storageClassName: gp3
    accessModes: ["ReadWriteOnce"]
    size: 10Gi

  # ClusterIP only. Expose through a private Ingress/ALB with TLS in production.
  service:
    type: ClusterIP
    port: 80

  # Auto-import EKS + Prometheus dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'eks'
        orgId: 1
        folder: 'EKS'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/eks

  dashboards:
    default:
      # EKS Cluster Overview (official)
      eks-cluster:
        gnetId: 19350
        revision: 1
        datasource: Prometheus

      # Node Exporter Full
      node-exporter:
        gnetId: 1860
        revision: 1
        datasource: Prometheus

      # Kubernetes Pod Overview
      k8s-pods:
        gnetId: 6417
        revision: 1
        datasource: Prometheus

  security:
    disable_initial_admin_creation: false

  plugins:
    - grafana-piechart-panel

  extraEnv:
    AWS_REGION: "us-west-2"

  ingress:
    enabled: false
